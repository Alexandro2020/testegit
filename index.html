<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./vue.js"></script>
    <title>Document</title>
    <style>
        .verde{
            background-color: green;
        }
        .branco{
            background-color: white;
        }
        .azul{
            /* background-color: blue; */
            background-color: rgb(111, 76, 92);
        }
        .borda{
            border: 1px solid;
        }

        .div-principal{
            width : 200px;
            height: 200px;
        }
        .div-comum{
            width : 50px;
            height: 50px;
            display: inline-block;
        }

    </style>
</head>
<body>   
    <div id="app">
        {{nome}}
        <h1 v-if="awesome">
            Vue é incrível!
        </h1>
        <h1 v-else>
            Oh não 😢
        </h1>
        <button v-on:click="exibirMensagem"  >Exibir mensagem de alerta.</button>
        <hr>

        <p>{{ message }}</p>
          <input v-model="message"> 

    </div>
    
    <script>
        const vm = new Vue({
            el:'#app',
            data:{
                awesome:true,
                nome:'Alexandro Alves',
                message: 'Olá Vue!'
            },
            methods:{
                exibirMensagem(){
                    console.log('ddddddddddddddd');
                    alert('Estou vivo.')
                }
            }    

        }) 
        
    </script>
</body>
</html>
